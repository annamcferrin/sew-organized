<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project | Sew Organized</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">Sew Organized</a>

            <div class="navbar-nav">
                <a class="nav-link" href="../index.html">Home</a>
                <a class="nav-link" href="../index.html#projects">Projects</a>
                <a class="nav-link active" aria-current="page" href="admin.html">Add Project</a>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <h1>Add Project</h1>
        <p>Add a new sewing project or alteration to Sew Organized.</p>

        <form id="add-form">
            <div class="mb-3">
                <label for="project-name" class="form-label">Project Name</label>
                <input type="text" class="form-control" id="project-name">
            </div>

            <div class="mb-3">
                <label for="project-type" class="form-label">Project Type</label>
                <select class="form-select" id="project-type">
                    <option>Sewing Project</option>
                    <option>Alteration</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="project-status" class="form-label">Status</label>
                <select class="form-select" id="project-status">
                    <option>Want to Start</option>
                    <option>In Progress</option>
                    <option>Completed</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="finish-date" class="form-label">Finish By</label>
                <input type="date" class="form-control" id="finish-date">
            </div>


            <div class="mb-3">
                <label for="project-notes" class="form-label">Notes</label>
                <textarea class="form-control" id="project-notes" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Add Project</button>
        </form>
        <div class="toast show mt-4" id="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Sew Organized</strong>
            </div>

            <div class="toast-body">
                Your project information is ready to be added.
            </div>
        </div>
    </main>
    <footer class="text-center py-4">

        <a href="https://github.com/annamcferrin" target="_blank">
            GitHub Profile
        </a>
        |
        <a href="https://github.com/annamcferrin/sew-organized" target="_blank">
            Source Code
        </a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <script src="../js/app.js"></script>

</body>


</html>
