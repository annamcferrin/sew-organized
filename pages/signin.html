<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Sew Organized</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="../index.html">Sew Organized</a>

            <div class="navbar-nav">
                <a class="nav-link" href="../index.html">Home</a>
                <a class="nav-link" href="../index.html#projects">Projects</a>
                <a class="nav-link" href="add-project.html">Add Project</a>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <h1>Sign In</h1>
        <p>Sign in to access your Sew Organized projects.</p>

        <form id="signin-form">
            <div class="mb-3">
    <label for="user-box" class="form-label">Username</label>
    <input type="text" class="form-control" id="user-box" required>
</div>

            <div class="mb-3">
                <label for="pwd-box" class="form-label">Password</label>
                <input type="password" class="form-control" id="pwd-box">
            </div>

            <button type="button" class="btn btn-primary" id="signin-btn">
                Sign In
            </button>
            <p id="message" class="text-danger mt-3" role="alert"></p>
        </form>
    </main>
    <footer class="text-center py-4">
        <a href="https://github.com/annamcferrin" target="_blank">
            GitHub Profile
        </a>
        |
        <a href="https://github.com/annamcferrin/sew-organized" target="_blank">
            Source Code
        </a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <script src="../js/signin.js"></script>

</body>

</html>
